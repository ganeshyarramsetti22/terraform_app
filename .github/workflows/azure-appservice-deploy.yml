name: Terraform Azure App Service Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # JOB 1 - TERRAFORM INFRASTRUCTURE
  # ============================================================
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: task-appservice

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars" -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan


  # ============================================================
  # JOB 2 - DEPLOY NODE.JS APPLICATION
  # ============================================================
  deploy-app:
    name: Deploy Node.js Application
    runs-on: ubuntu-latest

    needs: terraform

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: application/simple-user-app/package-lock.json

      - name: Install dependencies
        working-directory: application/simple-user-app
        run: npm ci

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: appservice-demo-gani-2026
          package: application/simple-user-app

      - name: Show App Service URL
        run: |
          echo "Application deployed successfully!"
          echo "https://appservice-demo-gani-2026.azurewebsites.net"